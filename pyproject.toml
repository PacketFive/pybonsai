# SPDX-License-Identifier: GPL-2.0

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pybonsai-lang"
dynamic = ["version"]
description = "PyBonsai, a hermetic subset of Python 3.12 interpreted from its syntax tree"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{ name = "PacketFive" }]
keywords = ["configuration", "dsl", "hermetic", "deterministic", "starlark", "interpreter"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Interpreters",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/PacketFive/pybonsai"
Source = "https://github.com/PacketFive/pybonsai"
Issues = "https://github.com/PacketFive/pybonsai/issues"

[dependency-groups]
# Everything the quality gates need, installed with "pip install --group dev"
# (pip 25.1 or later). Groups are not part of the package metadata, so the
# pybootstrap name on PyPI, which belongs to an unrelated placeholder, can be
# replaced by its repository here.
dev = [
  "pybootstrap @ git+https://github.com/packetfive/pybootstrap.git",
  "ruff>=0.4",
  "pyright>=1.1",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
]

[tool.setuptools.dynamic]
version = { attr = "pybonsai.__version__" }

# The repository's src directory is the pybonsai package itself.
[tool.setuptools]
packages = ["pybonsai"]
package-dir = { pybonsai = "src" }

# PEP 561 marker: the package ships its own type hints.
[tool.setuptools.package-data]
pybonsai = ["py.typed"]

# Quality gates, run with 'pybootstrap check'. Sources, line length and
# test paths are read from the tool tables below.
[tool.pybootstrap]
gates = ["format", "lint", "typecheck", "test"]
coverage-min = 80
coverage-package = "pybonsai"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests use assert, and test names describe themselves.
"tests/*" = ["S101", "D"]

# Tests import the installed package by name, since src/ has no
# pybonsai/ directory for ruff to discover it from.
[tool.ruff.lint.isort]
known-first-party = ["pybonsai"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov-report=term-missing --import-mode=importlib"
